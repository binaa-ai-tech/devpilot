# Publishes a GitHub Release when a version tag (v1.2.3) is pushed.
# The notes are that version's section of CHANGELOG.md.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: |
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/               { exit }
            on                            { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $V"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "DevPilot $GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag --latest
