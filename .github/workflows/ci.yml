name: CI

# Pipeline isolation:
#   • Cheap validation (lint + syntax + tests) runs on every PR and push — this
#     is the pre-merge safety gate, so nothing lands on develop unvalidated.
#   • Expensive work (build / deploy / publish) runs ONLY on a push to develop,
#     i.e. AFTER a PR has been merged. It never runs on the PR itself, so the
#     temporary PR phase stays fast and cheap.

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:

# Cancel superseded PR runs to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cheap gate — runs on PRs and pushes ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (scripts)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # warning-level gate: the scripts are warning-clean; keep them that way.
          shellcheck -S warning -e SC1090,SC1091 scripts/*.sh tests/*.sh install.sh

      - name: bash syntax check
        run: |
          for f in scripts/*.sh tests/*.sh install.sh; do
            bash -n "$f" || exit 1
          done

      - name: run test suite
        run: bash tests/run.sh

  # ── End to end on a sample Angular + .NET repo (no AI needed) ─────────────────
  # Installs DevPilot, runs the scripted /dp-deliver + /dp-release path (tracker,
  # versioning, changelog, PR on mocked Azure Repos, close, release), generates the
  # CI/CD pipelines and lints them with actionlint.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint -version
      - name: e2e
        run: bash tests/e2e.sh

  # ── macOS: the default /bin/bash there is 3.2 (2007) and the tools are BSD ────
  # Every `bash` call in the tests resolves to /bin/bash, so anything DevPilot runs
  # on a developer's Mac is exercised here.
  macos:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: use the system bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: versions
        run: bash --version | head -1; command -v jq curl git
      - name: test suite (bash 3.2)
        run: bash tests/run.sh
      - name: e2e (bash 3.2)
        run: bash tests/e2e.sh
